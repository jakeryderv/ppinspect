[project]
name = "ppinspect"
version = "0.1.0"
description = "Development stub for planned version-aware pyproject.toml analysis and editor tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jake Van Slyke" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jakeryderv/ppinspect"
Repository = "https://github.com/jakeryderv/ppinspect"
Issues = "https://github.com/jakeryderv/ppinspect/issues"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
