name: Publish to PyPI

on:
  push:
    tags:
      - v0.1.0

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false

      - name: Install development Python
        run: uv python install

      - name: Verify release version and development import
        run: |
          test "v$(uv version --short)" = "$GITHUB_REF_NAME"
          uv lock --check
          uv sync --locked
          uv run --locked python -c 'import ppinspect; from importlib.metadata import version; assert version("ppinspect") == "0.1.0"'

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Smoke-test wheel and source distribution
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$artifact" \
              python -I -c \
              'import ppinspect; from importlib.metadata import version; assert version("ppinspect") == "0.1.0"; print(ppinspect.__file__)'
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'jakeryderv/ppinspect' && github.ref == 'refs/tags/v0.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ppinspect/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false

      - name: Publish distributions to production PyPI
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
